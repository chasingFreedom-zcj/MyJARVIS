[project]
name = "myjarvis-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncmy>=0.2.18",
    "asyncpg>=0.32.0",
    "celery>=5.7.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openai>=3.57.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
